name: Git Checks

on: [pull_request]

jobs:
  block-fixup:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Block Fixup Commit Merge
      env:
        BASE_REF: ${{ github.base_ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        # Do not pipe git log into grep: if git fails, the check would pass
        subjects=$(git log --format=%s "origin/${BASE_REF}..${HEAD_SHA}")
        if echo "$subjects" | grep -E '^(fixup|squash|amend)! '; then
          echo "The commits above need to be squashed"
          exit 1
        fi

    - name: Gen docs
      run: make docs

    - name: Check for uncommitted documentation changes
      run: |
        if [[ -n $(git status -s) ]]; then
          echo "There are uncommitted changes after the task:"
          git status -s
          echo "Update the documentation on the proper *Config.java and commit generated docs"
          exit 1
        else
          echo "No changes detected."
        fi
      shell: bash
